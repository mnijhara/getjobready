name: Refresh tracked production artifacts

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-production-artifacts
  cancel-in-progress: true

jobs:
  build-artifacts:
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'github-actions[bot]' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Product regression verification
        run: npm run verify
      - name: Ensure production server listens
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const file = 'server.cjs';
          let s = fs.readFileSync(file, 'utf8');
          if (!/app\.listen\s*\(/.test(s)) {
            s += '\napp.listen(PORT, () => console.log(`GetJobReady listening on ${PORT}`));\n';
            fs.writeFileSync(file, s);
          }
          if (!/app\.listen\s*\(/.test(fs.readFileSync(file, 'utf8'))) process.exit(1);
          NODE
          node --check server.cjs
      - name: Build frontend
        run: npm run build
      - name: Build production server
        run: npx esbuild server.cjs --bundle --platform=node --format=cjs --outfile=server.js --packages=external
      - name: Verify production artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f server.js
          test -f server.cjs
          node --check server.js
          grep -R -q "GetJobReady" dist
          grep -R -q "AI Audio Interview" dist
          grep -R -q "General CV" dist
          grep -R -q "CV + specific JD" dist
          grep -R -q "Start live audio interview" dist
          grep -R -q "SpeechRecognition" dist
          PORT=4173 NODE_ENV=production node server.cjs > /tmp/getjobready.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          HEALTH_OK=0
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/api/health > /tmp/health.json; then HEALTH_OK=1; break; fi
            sleep 1
          done
          test "$HEALTH_OK" = 1
          grep -q '"ok":true' /tmp/health.json
          curl -fsS http://127.0.0.1:4173/ | grep -q 'GetJobReady'
      - name: Commit refreshed production artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.cjs dist server.js
          if git diff --cached --quiet; then echo "production artifacts are already current"; exit 0; fi
          git commit -m "build: refresh production artifacts"
          git push origin HEAD:main
