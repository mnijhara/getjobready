name: Build and verify GetJobReady
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Product regression verification
        run: npm run verify
      - name: Check production server
        run: node --check server.cjs
      - name: Build Vite frontend
        run: npm run build
      - name: Normalize Vite production entrypoint
        run: |
          test -f dist/index.src.html
          cp dist/index.src.html dist/index.html
          rm dist/index.src.html
          test -f dist/index.html
      - name: Verify source to production parity
        run: node scripts/verify-production-parity.mjs
      - name: Bundle production server
        run: npx esbuild server.cjs --bundle --platform=node --format=cjs --outfile=server.js --packages=external
      - name: Verify production artifact
        run: |
          test -f dist/index.html
          test -f server.js
          node --check server.js
          grep -R -q "GetJobReady" dist
          grep -R -q "AI Audio Interview" dist
          grep -R -q "General CV" dist
          grep -R -q "CV + specific JD" dist
          grep -R -q "SpeechRecognition" dist
          grep -R -q "Make your CV stronger first" dist
          grep -R -q "How it works" dist
          grep -R -q "Impress the Interviewer" dist
          echo "GetJobReady production artifact verified for ${GITHUB_SHA}"
      - name: Smoke test
        run: |
          PORT=4173 NODE_ENV=production node server.cjs > /tmp/getjobready.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in {1..30}; do if curl -fsS http://127.0.0.1:4173/api/health > /tmp/health.json; then break; fi; sleep 1; done
          grep -q '"ok":true' /tmp/health.json
          curl -fsS http://127.0.0.1:4173/ | grep -q 'GetJobReady'
      - name: Upload production artifact
        uses: actions/upload-artifact@v4
        with:
          name: getjobready-production-${{ github.sha }}
          path: |
            dist
            server.js
            server.cjs
            package.json
          retention-days: 14
      - name: Verify live deployment (best effort)
        continue-on-error: true
        shell: bash
        run: |
          set -u
          url="https://getjobready.online/"
          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36'
          echo "Checking live deployment at ${url}"
          status="unreachable"
          reason=""
          for i in {1..4}; do
            html="$(curl -sSL --max-time 20 -A "$ua" -w $'\n__HTTP_STATUS__%{http_code}' "$url?gjr_ci=${GITHUB_SHA}" || true)"
            code="$(sed -n 's/^__HTTP_STATUS__//p' <<<"$html" | tail -1)"
            body="$(sed '/^__HTTP_STATUS__/d' <<<"$html")"
            if [[ "$code" == "200" ]] && grep -q 'GetJobReady' <<<"$body"; then
              mapfile -t assets < <(grep -oE '(src|href)="/[^"]+\.(js|css)(\?[^\"]*)?"' <<<"$body" | sed -E 's/^(src|href)="//; s/"$//' | sort -u)
              live_bundle=""
              for asset in "${assets[@]}"; do
                case "$asset" in
                  *.js*) live_bundle+="$(curl -sSL --max-time 20 -A "$ua" "https://getjobready.online${asset}" || true)"$'\n' ;;
                esac
              done
              if grep -q 'Make your CV stronger first' <<<"$live_bundle" && grep -q 'SpeechRecognition' <<<"$live_bundle" && grep -q 'General CV' <<<"$live_bundle"; then
                status="verified"
                reason="public HTML and current native React bundle markers are present"
                break
              fi
              status="stale-or-unverifiable"
              reason="public site responded 200 but current native React markers were not found in deployed JS"
            elif [[ "$code" == "403" || "$code" == "429" ]]; then
              status="blocked"
              reason="public edge/WAF returned HTTP ${code}; GitHub runner cannot independently verify the deployment"
              break
            elif [[ "$code" == "404" ]]; then
              status="not-found"
              reason="public origin returned HTTP 404"
              break
            else
              status="unreachable"
              reason="public site returned HTTP ${code:-unknown}"
            fi
            sleep 10
          done
          {
            echo "### Live deployment verification"
            echo "- Status: **${status}**"
            echo "- Detail: ${reason}"
            echo "- Commit: \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$status" == "verified" ]]; then
            echo "Live deployment exposes the current native React career product."
          else
            echo "Live deployment could not be independently verified from the GitHub runner; build remains valid because the public edge may block automated probes."
          fi
