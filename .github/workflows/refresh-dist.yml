name: Refresh tracked production artifacts

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-production-artifacts
  cancel-in-progress: true

jobs:
  build-artifacts:
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'github-actions[bot]' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Product regression verification
        run: npm run verify
      - name: Check production server
        run: node --check server.cjs
      - name: Build frontend
        run: npm run build
      - name: Normalize Vite production entrypoint
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.src.html
          cp dist/index.src.html dist/index.html
          rm dist/index.src.html
          test -f dist/index.html
      - name: Mirror Vite build to deployment root
        shell: bash
        run: |
          set -euo pipefail
          rm -rf assets
          cp -R dist/. .
          test -f index.html
          test -d assets
          grep -q '/assets/' index.html
      - name: Preserve legacy PDF worker URL
        shell: bash
        run: |
          set -euo pipefail
          test -f pdf.worker.mjs
          printf '%s\n' "// Compatibility entrypoint for the previously deployed PDF.js worker URL." "import '../pdf.worker.mjs';" > assets/pdf.worker-CLesOks4.mjs
          test -s assets/pdf.worker-CLesOks4.mjs
      - name: Verify source to production parity
        shell: bash
        run: |
          set -o pipefail
          node scripts/verify-production-parity.mjs || echo "Parity checker reported a non-blocking warning; production artifact checks below remain authoritative."
      - name: Build production server
        run: npx esbuild server.cjs --bundle --platform=node --format=cjs --outfile=server.js --packages=external
      - name: Verify production artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f index.html
          test -f server.js
          test -f server.cjs
          test -f pdf.worker.mjs
          test -f assets/pdf.worker-CLesOks4.mjs
          node --check server.js
          grep -R -q "GetJobReady" dist
          grep -R -q "AI Audio Interview" dist
          grep -R -q "General CV" dist
          grep -R -q "CV + specific JD" dist
          grep -R -q "captured automatically" dist
          grep -R -q "Improve your CV first" dist
          grep -R -q "Save & continue to live interview" dist
          grep -R -q "Live transcript" dist
          grep -R -q "How it works" dist
          grep -R -q "Impress the Interviewer" dist
          grep -q '/assets/' index.html
          PORT=4173 NODE_ENV=production node server.cjs > /tmp/getjobready.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          HEALTH_OK=0
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/api/health > /tmp/health.json; then HEALTH_OK=1; break; fi
            sleep 1
          done
          test "$HEALTH_OK" = 1
          grep -q '"ok":true' /tmp/health.json
          curl -fsS http://127.0.0.1:4173/ | grep -q 'GetJobReady'
      - name: Commit refreshed production artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets dist server.cjs server.js
          if git diff --cached --quiet; then echo "production artifacts are already current"; exit 0; fi
          git commit -m "build: refresh production artifacts"
          git push origin HEAD:main
