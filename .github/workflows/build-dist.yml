name: Build and verify GetJobReady
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Product regression verification
        run: npm run verify
      - name: Check production server
        run: node --check server.cjs
      - name: Build Vite frontend
        run: npm run build
      - name: Normalize Vite production entrypoint
        run: |
          test -f dist/index.src.html
          cp dist/index.src.html dist/index.html
          rm dist/index.src.html
          test -f dist/index.html
      - name: Bundle production server
        run: npx esbuild server.cjs --bundle --platform=node --format=cjs --outfile=server.js --packages=external
      - name: Verify production artifact
        run: |
          test -f dist/index.html
          test -f server.js
          node --check server.js
          grep -R -q "GetJobReady" dist
          grep -R -q "AI Audio Interview" dist
          grep -R -q "General CV" dist
          grep -R -q "CV + specific JD" dist
          grep -R -q "SpeechRecognition" dist
          grep -R -q "YOUR CAREER FEED" dist
          grep -R -q "feed-nav" dist
          grep -R -q "Impress the interviewer" dist
          echo "GetJobReady production artifact verified for ${GITHUB_SHA}"
      - name: Smoke test
        run: |
          PORT=4173 NODE_ENV=production node server.cjs > /tmp/getjobready.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in {1..30}; do if curl -fsS http://127.0.0.1:4173/api/health > /tmp/health.json; then break; fi; sleep 1; done
          grep -q '"ok":true' /tmp/health.json
          curl -fsS http://127.0.0.1:4173/ | grep -q 'GetJobReady'
      - name: Upload production artifact
        uses: actions/upload-artifact@v4
        with:
          name: getjobready-production-${{ github.sha }}
          path: |
            dist
            server.js
            server.cjs
            package.json
          retention-days: 14
      - name: Verify live deployment
        shell: bash
        run: |
          set -euo pipefail
          url="https://getjobready.online/"
          echo "Checking live deployment at ${url}"
          for i in {1..12}; do
            html="$(curl -fsSL --max-time 20 -A 'GetJobReady-CI/1.0' "$url" || true)"
            if ! grep -q 'GetJobReady' <<<"$html"; then
              echo "Live site unavailable or not GetJobReady (attempt $i/12); waiting 15s..."
              sleep 15
              continue
            fi
            mapfile -t assets < <(grep -oE '(src|href)="/[^"]+\.(js|css)(\?[^\"]*)?"' <<<"$html" | sed -E 's/^(src|href)="//; s/"$//' | sort -u)
            live_bundle=""
            for asset in "${assets[@]}"; do
              case "$asset" in
                *.js*) live_bundle+="$(curl -fsSL --max-time 20 -A 'GetJobReady-CI/1.0' "https://getjobready.online${asset}" || true)"$'\n' ;;
              esac
            done
            if grep -q 'YOUR CAREER FEED' <<<"$live_bundle" && grep -q 'feed-nav' <<<"$live_bundle" && grep -q 'Impress the interviewer' <<<"$live_bundle" && grep -q 'gjr-demo' <<<"$live_bundle"; then
              echo "Live deployment exposes the current career feed, navigation and demo module bundle."
              exit 0
            fi
            echo "Live deployment has not updated to the current feed bundle yet (attempt $i/12); waiting 15s..."
            sleep 15
          done
          echo "Live deployment verification failed: public site assets did not expose the current career-feed/navigation markers within 3 minutes."
          exit 1
