name: Harden interview grounding

on:
  push:
    paths:
      - 'scripts/harden-interview-grounding.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'harden interview questions')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/harden-interview-grounding.mjs
      - run: node --check src/main-v2.jsx
      - run: npm install
      - run: npm run build
      - name: Commit hardened product
        run: |
          if git diff --quiet; then
            echo 'No changes were required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main-v2.jsx package.json dist index.html assets pdf.worker.mjs favicon.svg logo.svg manifest.webmanifest 2>/dev/null || true
          git add src/main-v2.jsx package.json
          git commit -m 'fix: harden interview questions and model answers'
          git pull --rebase --autostash origin main
          git push origin HEAD:main
