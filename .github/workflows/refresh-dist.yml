name: Refresh tracked production artifacts

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-production-artifacts
  cancel-in-progress: true

jobs:
  build-artifacts:
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'github-actions[bot]' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Product regression verification
        run: npm run verify
      - name: Check production server
        run: node --check server.cjs
      - name: Build frontend
        run: npm run build
      - name: Normalize Vite production entrypoint
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f dist/native.html ]]; then
            cp dist/native.html dist/index.html
            rm dist/native.html
          elif [[ ! -f dist/index.html ]]; then
            echo "No production HTML entry was generated" >&2
            exit 1
          fi
          test -f dist/index.html
      - name: Mirror Vite build to deployment root
        shell: bash
        run: |
          set -euo pipefail
          rm -rf assets
          cp -R dist/. .
          test -f index.html
          test -d assets
          grep -q '/assets/' index.html
      - name: Preserve compatibility asset URLs
        shell: bash
        run: |
          set -euo pipefail
          test -f pdf.worker.mjs
          current_js="$(find assets -maxdepth 1 -type f -name 'native-*.js' ! -name 'native-V7Q_2HxE.js' | sort | head -1)"
          current_css="$(find assets -maxdepth 1 -type f -name 'native-*.css' ! -name 'native-BDyLIQNb.css' | sort | head -1 || true)"
          test -n "$current_js"
          printf '%s\n' "// Compatibility loader for cached previous production HTML." "import './$(basename "$current_js")';" > assets/native-V7Q_2HxE.js
          printf '%s\n' "// Compatibility loader for cached previous production HTML." "import './$(basename "$current_js")';" > assets/index-BqWIDi9r.js
          if [[ -n "$current_css" ]]; then
            printf '%s\n' "/* Compatibility stylesheet for cached previous production HTML. */" "@import url('./$(basename "$current_css")');" > assets/index-BDyLIQNb.css
          else
            printf '%s\n' "/* Compatibility stylesheet for cached previous production HTML. */" "@import url('./native-BDyLIQNb.css');" > assets/index-BDyLIQNb.css
          fi
          printf '%s\n' "// Compatibility entrypoint for the previously deployed PDF.js worker URL." "import '../pdf.worker.mjs';" > assets/pdf.worker-CLesOks4.mjs
          test -s assets/native-V7Q_2HxE.js
          test -s assets/index-BqWIDi9r.js
          test -s assets/index-BDyLIQNb.css
          test -s assets/pdf.worker-CLesOks4.mjs
      - name: Verify source to production parity
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-production-parity.mjs
      - name: Build production server
        run: npx esbuild server.cjs --bundle --platform=node --format=cjs --outfile=server.js --packages=external
      - name: Verify production artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f index.html
          test -f server.js
          test -f server.cjs
          test -f pdf.worker.mjs
          test -f assets/native-V7Q_2HxE.js
          test -f assets/pdf.worker-CLesOks4.mjs
          test -f assets/index-BqWIDi9r.js
          test -f assets/index-BDyLIQNb.css
          node --check server.js
          grep -q '/assets/' index.html
          grep -q 'interview-turn' server.js
          grep -q 'ai-status' server.js
          js_asset="$(grep -oE '/assets/[^" ]+\.js' index.html | head -1)"
          test -n "$js_asset"
          test "$(wc -c < "${js_asset#/}")" -gt 150000
      - name: Commit refreshed production artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets dist server.cjs server.js
          if git diff --cached --quiet; then
            echo "production artifacts are already current"
            exit 0
          fi
          git commit -m "build: refresh production artifacts"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Production artifact push raced with another main update; retrying ($attempt/3)." >&2
            sleep $((attempt * 2))
          done
          echo "Unable to push refreshed production artifacts after 3 race-safe retries." >&2
          exit 1
