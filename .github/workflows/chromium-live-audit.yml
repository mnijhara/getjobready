name: Chromium live student audit
on:
  push:
    branches: [main]
    paths:
      - 'scripts/live-audit.mjs'
      - 'scripts/student-cv-live-audit.mjs'
      - '.github/workflows/chromium-live-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium test runner
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Create student fixtures
        run: |
          python -m pip install --disable-pip-version-check reportlab pillow python-docx
          mkdir -p /tmp/gjr-audit
          python - <<'PY'
          from reportlab.pdfgen import canvas
          from reportlab.lib.pagesizes import letter
          from PIL import Image, ImageDraw
          from docx import Document
          c = canvas.Canvas('/tmp/gjr-audit/dummy-text.pdf', pagesize=letter)
          for y, t in [(740,'Alex Student'),(720,'Computer Science Student | alex@example.com'),(700,'Education: B.Tech Computer Science, Example University'),(680,'Projects: Built a campus placement tracker using React and Supabase.'),(660,'Skills: React, JavaScript, SQL, Python')]: c.drawString(72,y,t)
          c.save()
          img=Image.new('RGB',(1200,1600),'white'); d=ImageDraw.Draw(img)
          for y,t in [(100,'Alex Student'),(180,'Computer Science Student'),(260,'Education: B.Tech Computer Science'),(340,'Project: Campus placement tracker'),(420,'Skills: React, JavaScript, SQL, Python')]: d.text((80,y),t,fill='black')
          img.save('/tmp/gjr-audit/scanned-cv.pdf',resolution=150)
          doc=Document(); doc.add_paragraph('Alex Student'); doc.add_paragraph('Computer Science Student | alex@example.com'); doc.add_paragraph('Education: B.Tech Computer Science, Example University'); doc.add_paragraph('Projects: Built a campus placement tracker using React and Supabase.'); doc.add_paragraph('Skills: React, JavaScript, SQL, Python'); doc.save('/tmp/gjr-audit/dummy.docx')
          open('/tmp/gjr-audit/dummy.txt','w').write('Alex Student\nComputer Science Student | alex@example.com\nEducation: B.Tech Computer Science, Example University\nProjects: Built a campus placement tracker using React and Supabase.\nSkills: React, JavaScript, SQL, Python')
          open('/tmp/gjr-audit/not-allowed.exe','wb').write(b'not a supported document')
          open('/tmp/gjr-audit/vijit-student-cv.txt','w').write('''Vijit Vishnoi\nBackend Engineer | Full Stack Developer | Software Engineer\nEducation: Indian Institute of Information Technology, Ranchi — B.Tech Computer Science & Engineering, 2023-2027, CGPA 8.5/10\nExperience: Coding Panda — Full Stack Intern, Sept 2025-Nov 2025\nCoding Panda: Streamlined test case batch storage with Cloudflare R2; designed and integrated Judge 0 execution APIs with real-time execution, error diagnostics and resource tracking; partnered with senior developers in Agile to scale a basic compiler into a production-grade platform supporting 5+ languages.\nCoding Panda technologies: JavaScript, TypeScript, Express, Node.js, Next.js, MongoDB, OAuth, Tailwind CSS, Monaco Editor, Cloudflare R2\nAchievements: 800+ algorithmic challenges across Codeforces, CodeChef and LeetCode; 3-Star CodeChef, Knight LeetCode, Pupil Codeforces; authored CI-validated automated boundary tests exposing a Windows session bug.\nProject: Sync Engine — real-time collaborative code editor using Go and React, custom CRDT engine with fractional indexing for state consistency across concurrent edits; Upstash Redis Pub/Sub and Gorilla WebSockets; 50 ms adaptive batching; write-behind Go cache with 5-second debounced ticker to MongoDB Atlas; isolated remote execution for live multi-language compilation.\nProject: TravelGen AI — Go/Gin backend and React/TypeScript frontend; processes 5+ parameters to generate itineraries up to 14 days; LLM-driven data pipeline with strict JSON schemas and 50+ data points per query; React-Leaflet route visualizer with up to 15+ daily activity markers.\nProject: Edusphere — Node.js, Express, React, Sequelize and MySQL LMS; stress-tested under 200 concurrent users with 100% API success rate; RBAC with JWT; 20+ REST APIs.\nTechnical skills: C, C++, Java, Go, JavaScript, Python, TypeScript, HTML, Tailwind CSS, React.js, Next.js, gRPC, Express, Node.js, REST APIs, Socket.IO, MongoDB, MySQL, Redis, Docker, Kubernetes, AWS, GCP, Azure, CI/CD, Cloudflare R2, Git, GitHub, VS Code, Linux, Figma, Jira.\nCoursework: DSA, OOP, DBMS, Operating Systems, Artificial Intelligence, Computer Networks, Software Engineering, System Design.\nLeadership: led a 3-person engineering team for the Adobe Hackathon; advanced past 50,000+ teams to the Semifinals; progressed from Vice-Captain to Captain of the College Table Tennis team, mentoring 14 peers and winning first place at the Inter-IIIT Sports Meet 2025 among 20 teams.''')
          PY
      - name: Run desktop + mobile Chromium audit
        env:
          GJR_AUDIT_FILES: /tmp/gjr-audit
        run: node scripts/live-audit.mjs
      - name: Run real-student CV interview audit
        env:
          GJR_AUDIT_FILES: /tmp/gjr-audit
        run: node scripts/student-cv-live-audit.mjs
      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chromium-live-audit-report-${{ github.sha }}
          path: |
            live-audit-report.json
            student-cv-live-audit-report.json
          retention-days: 14
