name: Security hardening
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cors:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify fail-closed CORS policy
        shell: bash
        run: |
          set -euo pipefail
          grep -q "process.env.PUBLIC_BASE_URL || 'https://getjobready.online'" server.cjs
          node --check server.cjs
      - name: Verify AI failure contract
        run: node scripts/verify-ai-failure-contract.mjs
      - name: Exercise CORS policy
        run: node scripts/security-smoke.mjs
